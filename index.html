<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matlådebyggare 6.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1 id="app-title">Matlådebyggare 6.0</h1>
    <div class="desktop-tab-bar">
        <div class="desktop-tabs-left">
            <button class="desktop-tab-btn active" onclick="switchTab('builder-tab', this)" id="tab-builder">Byggaren</button>
            <button class="desktop-tab-btn" onclick="switchTab('components-tab', this)" id="tab-components">Komponenter</button>
            <button class="desktop-tab-btn" onclick="switchTab('batch-tab', this)" id="tab-batch">Storkok</button>
            <button class="desktop-tab-btn" onclick="switchTab('freezer-tab', this)" id="tab-freezer">Frys</button>
            <button class="desktop-tab-btn" onclick="switchTab('pantry-tab', this)" id="tab-pantry">Skafferi</button>
            <button class="desktop-tab-btn" onclick="switchTab('schedule-tab', this)" id="tab-schedule">Matsedel</button>
            <button class="desktop-tab-btn" onclick="switchTab('settings-tab', this)" id="tab-settings">Inställningar</button>
        </div>
    </div>
    
    <div id="builder-tab" class="tab-content active">
        <div class="settings-card" style="background:#f7fafc; padding:12px; margin-bottom:15px; display:flex; gap:20px; flex-wrap:wrap;">
            <div>
                <label id="lbl-layout" style="font-size:13px; color:var(--primary); font-weight:bold;">Form- & batch-storlek:</label>
                <select id="preset-layout" onchange="changeLayout()" style="width:220px; margin-top:5px; font-weight:bold;">
                    <option value="4_250" id="opt-l4">4 st lådor (max 250 ml)</option>
                    <option value="2_500" id="opt-l2">2 st stora lådor (max 500 ml)</option>
                    <option value="6_125" id="opt-l6">6 st små lådor (max 125 ml)</option>
                    <option value="10_30" id="opt-l10">10 st små såskuber (max 30 ml)</option>
                </select>
            </div>
            <div>
                <label id="lbl-mode" style="font-size:13px; color:var(--success); font-weight:bold;">Recepttyp per låda:</label>
                <select id="recipe-mode" onchange="changeLayout()" style="width:220px; margin-top:5px; font-weight:bold;">
                    <option value="2" id="opt-m2">2 Ingredienser (Protein + Bas)</option>
                    <option value="1" id="opt-m1">1 Ingrediens (Enkelråvara / Soppa)</option>
                </select>
            </div>
        </div>
        <div class="action-bar">
            <button class="btn-action btn-save" id="btn-save" onclick="saveConfig()">💾 Spara</button>
            <button class="btn-action" id="btn-reset" onclick="clearConfig()">🔄 Återställ</button>
            <button class="btn-freeze" id="btn-freeze" onclick="sendToFreezer()">🔮 Skicka till Frys</button>
        </div>
        <div id="intro-tip" class="gbp-intro"></div>
        <div class="form-grid" id="grid"></div>
        <div class="shopping-list">
            <h3 id="shopping-title"></h3>
            <div class="sg">
                <div><strong id="prot-header"></strong><ul id="lp"></ul></div>
                <div><strong id="carb-header"></strong><ul id="lc"></ul></div>
            </div>
            <div id="total-price-box" style="margin-top:20px; padding-top:10px; border-top:2px dashed #cbd5e0; font-size:16px; font-weight:bold;">
                <span id="price-label"></span> <span id="total-cost-val">0</span> kr
            </div>
            <button class="btn-action btn-copy" id="btn-copy" onclick="copyToClipboard()"></button>
        </div>
        <div class="kitchen-box"><strong id="kitchen-title"></strong><ul style="margin:5px 0 0 0; padding-left:20px; color:#4a5568;" id="kitchen-list"></ul></div>
    </div>

    <!-- FLIKAR 2-7 (Samma som innan) -->
    <div id="components-tab" class="tab-content"><div class="settings-card">...</div></div>
    <div id="batch-tab" class="tab-content"><div class="settings-card">...</div></div>
    <div id="freezer-tab" class="tab-content">...</div>
    <div id="pantry-tab" class="tab-content">...</div>
    <div id="schedule-tab" class="tab-content">...</div>
    <div id="settings-tab" class="tab-content">
        <div class="settings-card">
            <h3 style="margin-top:0; color:var(--primary);">🔄 Data & Backup (JSON)</h3>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-action" style="background:var(--primary); color:white; border:none; padding:10px 15px;" onclick="exportDataJSON()">📥 Exportera JSON-backup</button>
                <label class="btn-action" style="background:var(--success); color:white; border:none; padding:10px 15px; cursor:pointer;">
                    📤 Importera JSON <input type="file" id="import-file-input" accept=".json" onchange="importDataJSON(event)" style="display:none;">
                </label>
            </div>
        </div>
    </div>
</div>

<div id="more-menu" class="more-menu">
    <button class="menu-link" onclick="window.switchTab('builder-tab', this); toggleMoreMenu()">Byggaren</button>
    <button class="menu-link" onclick="window.switchTab('components-tab', this); toggleMoreMenu()">Komponenter</button>
    <button class="menu-link" onclick="window.switchTab('batch-tab', this); toggleMoreMenu()">Storkok</button>
    <button class="menu-link" onclick="window.switchTab('settings-tab', this); toggleMoreMenu()">Inställningar</button>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="window.switchTab('freezer-tab', this)">Frys</button>
    <button class="nav-item" onclick="window.switchTab('pantry-tab', this)">Skafferi</button>
    <button class="nav-item" onclick="window.switchTab('schedule-tab', this)">Matsedel</button>
    <button class="nav-item" onclick="toggleMoreMenu()">Mer</button>
</nav>

<script src="lang.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
